name: Update Hall of Fame stats

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6 AM Houston time (after late games finish)
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write   # commit the refreshed _data files
  pages: write      # request a GitHub Pages rebuild

concurrency:
  group: hof-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Refresh stats
        run: python scripts/update_hof_stats.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- _data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/players.yml _data/hof_meta.yml
          git commit -m "Update Hall of Fame stats ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits pushed with the workflow's token don't always kick off a
      # branch-deployed Pages build, so ask for one explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
